# Local stack: Streamlit app + FastAPI + streamable-HTTP MCP server (the app and API use the HTTP MCP server via CG_MCP_URL).
# Secrets come from .env (gitignored): OPENAI_API_KEY, OPENAI_API_BASE, CG_RECEIPT_KEY, CG_API_KEY, CG_MCP_TOKEN.
services:
  mcp:
    build: .
    command: ["python", "-m", "mcp_server.claimguard_mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    environment: [CG_MCP_TOKEN]
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment: { CG_MCP_URL: "http://mcp:8765/mcp" }
    ports: ["8000:8000"]
    depends_on: [mcp]
  app:
    build: .
    env_file: .env
    environment: { CG_MCP_URL: "http://mcp:8765/mcp" }
    ports: ["8501:8501"]
    depends_on: [mcp]
